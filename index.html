<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="aurora">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>T.C.K — TalentCloud Keyboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Hallmark · macrostructure: Workbench · tone: technical · anchor hue: cool-indigo */
        :root {
            --bg: #0a0a0c;
            --surface: #111218;
            --surface2: #161821;
            --raised: #1c1f2d;
            --raisedh: #24293a;
            --bd: #262b3a;
            --fg: #e8eaf0;
            --mut: #888fa3;
            --acc: #5b8def;
            --acc-solid: #5b8def;
            --acc-shadow: rgba(91,141,239,.4);
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Hanken Grotesk', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 48px;
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 24px;
        }

        :root[data-theme="light"] {
            --bg: #f4f5f8;
            --surface: #ffffff;
            --surface2: #eceef3;
            --raised: #e6e9f0;
            --raisedh: #dbdfe9;
            --bd: #d2d7e2;
            --fg: #1a1d26;
            --mut: #5c6376;
        }

        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; overflow-x: clip; }
        body {
            background: var(--bg);
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--fg);
            line-height: 1.6;
        }

        /* ── Landing Page ─────────────────────────────────────────────────────── */
        .landing-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: var(--bg);
            color: var(--fg);
        }

        .nav-pill {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 8px 20px;
            background: rgba(20, 22, 31, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bd);
            border-radius: 100px;
            z-index: 100;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--mut);
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 24px;
            max-width: 900px;
            margin: 0 auto;
        }

        .hero-badge {
            font-family: var(--font-mono);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--acc);
            background: rgba(91,141,239,0.1);
            padding: 4px 12px;
            border-radius: 100px;
            border: 1px solid rgba(91,141,239,0.2);
            margin-bottom: 24px;
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -0.03em;
            margin: 0 0 24px 0;
            color: #fff;
        }

        .hero-sub {
            font-size: 1.25rem;
            color: var(--mut);
            max-width: 600px;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .cta-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            background: var(--acc);
            color: #fff;
            border-radius: var(--radius-md);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: filter 0.2s, transform 0.2s;
            box-shadow: 0 8px 24px -6px var(--acc-shadow);
        }

        .cta-primary:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 1100px;
            margin: 80px auto;
            padding: 0 24px;
        }

        .feature-card {
            padding: 32px;
            background: var(--surface);
            border: 1px solid var(--bd);
            border-radius: var(--radius-lg);
            transition: border-color 0.2s;
        }

        .feature-card:hover {
            border-color: var(--acc);
        }

        .feature-icon {
            width: 32px;
            height: 32px;
            background: var(--raised);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: var(--acc);
            font-size: 18px;
        }

        .feature-title {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 12px 0;
        }

        .feature-desc {
            color: var(--mut);
            font-size: 14px;
            margin: 0;
        }

        .footer {
            padding: 60px 24px;
            text-align: center;
            border-top: 1px solid var(--bd);
            background: var(--surface);
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--mut);
        }

        /* ── App Styles ───────────────────────────────────────────────────────── */
        .app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .accent-bar { height: 2px; background: var(--acc); flex: none; }
        .titlebar { display: flex; align-items: center; gap: 14px; padding: 0 16px; height: 50px; background: var(--surface); border-bottom: 1px solid var(--bd); flex: none; }
        .brand { display: flex; align-items: center; gap: 11px; }
        .brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--acc); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px -4px rgba(91,141,239,.7); flex: none; }
        .brand-text { display: flex; flex-direction: column; line-height: 1.06; }
        .brand-name { font-family: var(--font-display); font-weight: 700; font-size: 15.5px; letter-spacing: .4px; }
        .brand-sub { font-size: 10px; color: var(--mut); font-weight: 500; letter-spacing: .5px; }
        .spacer { flex: 1; }
        .tb-select { appearance: none; background: var(--raised); color: var(--fg); border: 1px solid var(--bd); border-radius: 9px; padding: 7px 30px 7px 12px; font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" fill="none" stroke="%23888fa3" stroke-width="1.6"><path d="M2 4l3 3 3-3"/></svg>'); background-repeat: no-repeat; background-position: right 11px center; }
        .tb-model { width: 170px; background: var(--raised); color: var(--fg); border: 1px solid var(--bd); border-radius: 9px; padding: 7px 12px; font-family: var(--font-mono); font-size: 12px; outline: none; }
        .tb-icon-btn { width: 36px; height: 36px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--raised); color: var(--fg); border: 1px solid var(--bd); border-radius: 9px; cursor: pointer; font-size: 15px; transition: border-color .15s; }
        .tb-icon-btn:hover { border-color: var(--acc-solid); }
        .tb-settings-btn { display: flex; align-items: center; gap: 7px; background: var(--acc); color: #fff; border: none; border-radius: 9px; padding: 8px 15px; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 14px -4px var(--acc-shadow); transition: filter .15s; }
        .tb-settings-btn:hover { filter: brightness(1.08); }
        .body { flex: 1; display: flex; min-height: 0; }
        .sidebar { width: 252px; flex: none; background: var(--surface); border-right: 1px solid var(--bd); overflow-y: auto; padding: 16px 13px; display: flex; flex-direction: column; gap: 20px; }
        .section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 11px; }
        .section-pip { width: 3px; height: 12px; border-radius: 3px; background: var(--acc); flex: none; }
        .section-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .9px; color: var(--mut); font-weight: 600; }
        .section-list { display: flex; flex-direction: column; gap: 6px; }
        .agent-btn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 9px; border-radius: 9px; border: 1px solid var(--bd); background: var(--raised); color: var(--fg); font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; transition: background .12s, border-color .12s; }
        .agent-btn:hover { background: var(--raisedh); border-color: var(--acc-solid); }
        .agent-badge { width: 22px; height: 22px; flex: none; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; color: #cfe0ff; background: rgba(91,141,239,.16); border: 1px solid rgba(91,141,239,.3); }
        .cmd-btn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 9px; border-radius: 9px; border: 1px solid var(--bd); background: var(--raised); color: var(--fg); font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; transition: background .12s; }
        .cmd-btn:hover { background: var(--raisedh); }
        .cmd-icon { width: 22px; height: 22px; flex: none; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #3fd99b; background: rgba(63,217,155,.13); border: 1px solid rgba(63,217,155,.28); }
        .cmd-label { font-family: var(--font-mono); font-size: 12px; }
        .sc-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
        .sc-connected { display: flex; align-items: center; gap: 7px; color: #3fd99b; font-size: 12px; font-weight: 600; }
        .sc-disconnect { background: none; border: none; color: var(--mut); font: inherit; font-size: 11px; cursor: pointer; padding: 2px 4px; transition: color .12s; }
        .sc-disconnect:hover { color: #ff7a6b; }
        .repo-list { display: flex; flex-direction: column; gap: 4px; }
        .repo-btn { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 7px 9px; border-radius: 8px; border: 1px solid transparent; background: var(--raised); color: var(--fg); font: inherit; font-size: 12px; cursor: pointer; overflow: hidden; transition: border-color .12s; }
        .repo-btn:hover { border-color: var(--acc-solid); }
        .repo-name { font-family: var(--font-mono); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .scaffold-select { appearance: none; width: 100%; background: var(--raised); color: var(--fg); border: 1px solid var(--bd); border-radius: 9px; padding: 8px 30px 8px 11px; font: inherit; font-size: 12.5px; cursor: pointer; margin-bottom: 8px; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" fill="none" stroke="%23888fa3" stroke-width="1.6"><path d="M2 4l3 3 3-3"/></svg>'); background-repeat: no-repeat; background-position: right 11px center; outline: none; }
        .scaffold-list { display: flex; flex-direction: column; gap: 6px; }
        .scaffold-btn { width: 100%; text-align: left; padding: 8px 11px; border-radius: 9px; border: 1px solid var(--bd); background: var(--raised); color: var(--fg); font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; transition: background .12s; }
        .scaffold-btn:hover { background: var(--raisedh); }
        .scaffold-input { width: 100%; background: var(--raised); color: var(--fg); border: 1px solid var(--bd); border-radius: 9px; padding: 8px 11px; font-family: var(--font-mono); font-size: 12px; outline: none; }
        .scaffold-create-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 11px; border-radius: 9px; border: none; background: var(--acc); color: #fff; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: filter .15s; }
        .scaffold-create-btn:hover { filter: brightness(1.08); }
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .editor-tabs { display: flex; align-items: center; background: var(--surface2); border-bottom: 1px solid var(--bd); flex: none; padding-right: 10px; }
        .tab-active { position: relative; display: flex; align-items: center; gap: 9px; padding: 10px 16px; background: #0c0e13; color: #e8eaf0; font-size: 12.5px; font-weight: 500; }
        .tab-lang-dot { width: 8px; height: 8px; border-radius: 2px; background: #f0b07e; }
        .tab-underline { position: absolute; left: 0; bottom: -1px; height: 2px; width: 100%; background: var(--acc); }
        .tab-breadcrumb { margin-left: 14px; font-family: var(--font-mono); font-size: 11px; color: var(--mut); }
        .commit-btn { display: flex; align-items: center; gap: 6px; padding: 5px 13px; border-radius: 8px; border: none; background: var(--acc); color: #fff; font: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer; transition: filter .15s; }
        .commit-btn:hover { filter: brightness(1.08); }
        .editor-body { flex: 1; min-height: 0; display: flex; background: #0c0e13; overflow: auto; }
        .line-nums { flex: none; padding: 14px 10px 14px 14px; text-align: right; font-family: var(--font-mono); font-size: 13px; line-height: 22px; color: #454b5e; user-select: none; }
        .code-body { flex: 1; padding: 14px 16px; font-family: var(--font-mono); font-size: 13px; line-height: 22px; color: #d7dbe6; white-space: pre; }
        .terminal { height: 236px; flex: none; background: #0a0c11; border-top: 1px solid var(--bd); display: flex; flex-direction: column; }
        .terminal-header { display: flex; align-items: center; gap: 9px; padding: 7px 14px; background: var(--surface2); border-bottom: 1px solid var(--bd); flex: none; }
        .terminal-dot { width: 8px; height: 8px; border-radius: 50%; background: #3fd99b; box-shadow: 0 0 8px #3fd99b; animation: tckpulse 2.4s ease-in-out infinite; }
        .terminal-title { font-size: 11.5px; font-weight: 600; color: var(--fg); }
        .terminal-shell { font-family: var(--font-mono); font-size: 10.5px; color: var(--mut); background: var(--raised); padding: 2px 8px; border-radius: 6px; }
        .terminal-output { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 14px; font-family: var(--font-mono); font-size: 12px; line-height: 1.65; color: #c9cdd8; white-space: pre-wrap; }
        .terminal-row { display: flex; align-items: center; gap: 9px; border-top: 1px solid var(--bd); padding: 0 14px; flex: none; }
        .terminal-prompt { font-family: var(--font-mono); color: #3fd99b; font-size: 13px; }
        .terminal-input { flex: 1; background: none; border: none; outline: none; color: #c9cdd8; font-family: var(--font-mono); font-size: 12.5px; padding: 11px 0; }
        .caret { display: inline-block; width: 8px; height: 15px; background: #c9cdd8; vertical-align: -2px; animation: tckcaret 1.1s step-end infinite; }
        .chat-panel { width: 362px; flex: none; background: var(--surface); border-left: 1px solid var(--bd); display: flex; flex-direction: column; min-height: 0; }
        .chat-header { display: flex; align-items: center; gap: 9px; padding: 13px 15px; border-bottom: 1px solid var(--bd); flex: none; }
        .chat-icon { width: 24px; height: 24px; border-radius: 7px; background: var(--acc); display: flex; align-items: center; justify-content: center; flex: none; }
        .chat-title { font-family: var(--font-display); font-weight: 600; font-size: 14px; }
        .model-pill { font-family: var(--font-mono); font-size: 10.5px; color: var(--mut); background: var(--raised); padding: 3px 9px; border-radius: 7px; }
        .chat-messages { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 13px; }
        .msg-user { align-self: flex-end; max-width: 88%; }
        .msg-ai   { align-self: flex-start; max-width: 92%; }
        .msg-who { font-size: 9.5px; text-transform: uppercase; letter-spacing: .7px; color: var(--mut); margin-bottom: 4px; }
        .msg-who.ai { color: #7fa6ff; }
        .msg-user .msg-who { text-align: right; }
        .msg-bubble-user { background: var(--raised); border: 1px solid var(--bd); border-radius: 12px 12px 4px 12px; padding: 9px 12px; font-size: 13px; line-height: 1.5; }
        .msg-bubble-ai { background: rgba(91,141,239,.09); border: 1px solid rgba(91,141,239,.24); border-radius: 12px 12px 12px 4px; padding: 11px 12px; font-size: 13px; line-height: 1.55; }
        .code-ref { font-family: var(--font-mono); font-size: 12px; color: #9bb4ff; }
        .code-block { margin-top: 9px; background: #0a0c11; border: 1px solid #20242f; border-radius: 9px; padding: 10px 11px; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.6; color: #d7dbe6; white-space: pre; overflow-x: auto; }
        .code-note { margin-top: 9px; }
        .chat-input-area { border-top: 1px solid var(--bd); padding: 12px; flex: none; display: flex; flex-direction: column; gap: 9px; }
        .chat-textarea { resize: none; height: 62px; background: var(--bg); color: var(--fg); border: 1px solid var(--bd); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 13px; outline: none; transition: border-color .15s; }
        .chat-textarea:focus { border-color: var(--acc-solid); }
        .chat-send-btn { align-self: flex-end; display: flex; align-items: center; gap: 7px; padding: 9px 18px; border-radius: 10px; border: none; background: var(--acc); color: #fff; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 14px -4px var(--acc-shadow); transition: filter .15s; }
        .chat-send-btn:hover { filter: brightness(1.08); }
        .modal-backdrop { position: fixed; inset: 0; background: rgba(6,8,12,.62); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 24px; opacity: 0; pointer-events: none; transition: opacity .18s; }
        .modal-backdrop.open { opacity: 1; pointer-events: auto; }
        .modal { width: 560px; max-width: 100%; max-height: 84vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--bd); border-radius: 16px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.7); transform: translateY(10px); transition: transform .18s; }
        .modal-backdrop.open .modal { transform: translateY(0); }
        .modal-header { display: flex; align-items: center; gap: 11px; padding: 18px 20px; border-bottom: 1px solid var(--bd); }
        .modal-icon { width: 26px; height: 26px; border-radius: 8px; background: var(--acc); display: flex; align-items: center; justify-content: center; flex: none; }
        .modal-title { font-family: var(--font-display); font-weight: 600; font-size: 16px; }
        .modal-close { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background: var(--raised); border: 1px solid var(--bd); border-radius: 8px; color: var(--fg); cursor: pointer; transition: border-color .12s; }
        .modal-close:hover { border-color: #ff7a6b; }
        .modal-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 18px; }
        .field-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .9px; color: var(--mut); font-weight: 600; margin-bottom: 8px; }
        .field-input { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--bd); border-radius: 9px; padding: 9px 12px; font-family: var(--font-mono); font-size: 12px; outline: none; transition: border-color .15s; }
        .field-input:focus { border-color: var(--acc-solid); }
        .provider-card { display: flex; align-items: center; justify-content: space-between; background: var(--raised); border: 1px solid var(--bd); border-radius: 10px; padding: 10px 12px; margin-bottom: 7px; }
        .provider-name { font-weight: 600; font-size: 13px; }
        .provider-url { font-family: var(--font-mono); font-size: 11px; color: #7fa6ff; }
        .provider-remove { background: none; border: 1px solid var(--bd); border-radius: 7px; color: var(--mut); font: inherit; font-size: 11.5px; padding: 5px 11px; cursor: pointer; transition: border-color .12s, color .12s; }
        .provider-remove:hover { border-color: #ff7a6b; color: #ff7a6b; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 9px; padding: 16px 20px; border-top: 1px solid var(--bd); }
        .btn-cancel { padding: 9px 16px; border-radius: 9px; border: 1px solid var(--bd); background: var(--raised); color: var(--fg); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: background .12s; }
        .btn-cancel:hover { background: var(--raisedh); }
        .btn-save { padding: 9px 20px; border-radius: 9px; border: none; background: var(--acc); color: #fff; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 14px -4px var(--acc-shadow); transition: filter .15s; }
        .btn-save:hover { filter: brightness(1.08); }
        @keyframes tckpulse { 0%,100%{opacity:1}50%{opacity:.35} }
        @keyframes tckcaret  { 0%,49%{opacity:1}50%,100%{opacity:0} }
    </style>
</head>
<body>
    <div id="app-root"></div>
    <script type="module" src="/src/ui/main.ts"></script>
</body>
</html>
