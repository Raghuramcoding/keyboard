[build]
target = "index.html"
dist = "dist"

[serve]
# Proxy API + terminal websocket to the native T.C.K server during development.
port = 8080

[[proxy]]
backend = "http://127.0.0.1:3000/api"
rewrite = "/api/"

# In dev, /api/ai/ goes directly to tck-ai (port 3002).
# In production, the Rust server proxies it.
[[proxy]]
backend = "http://127.0.0.1:3002/v1"
rewrite = "/api/ai/"

[[proxy]]
backend = "ws://127.0.0.1:3000/ws"
rewrite = "/ws/"
ws = true
