[package]
name = "tck-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "T.C.K (TalentCloud Keyboard) — desktop app: embedded server + native webview"

[[bin]]
name = "tck-desktop"
path = "src/main.rs"

[dependencies]
libc = "0.2"
tokio = { version = "1", features = ["full"] }
tck-server = { path = "../tck-server" }
tao = "0.30"
wry = "0.47"
url = "2"
rust-embed = "8"
tempfile = "3"
tray-icon = "0.24"
dirs = "5"
winreg = "0.52"

